services:
  atlas:
    build: .
    restart: unless-stopped
    environment:
      ATLAS_TOKEN: ${ATLAS_TOKEN:?set ATLAS_TOKEN in .env}
      ATLAS_ROOT: /data
      ATLAS_GIT: "1"
      ATLAS_MAX_SENSITIVITY: ${ATLAS_MAX_SENSITIVITY:-internal}
      ATLAS_AUDIT_LOG: ${ATLAS_AUDIT_LOG:-}
      # Phase 4 OAuth — all optional, all-or-nothing (see docs/ADR-001-auth.md).
      # Vars in .env aren't auto-injected into the container; each one used
      # by the app must be listed here explicitly or it's silently empty.
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-}
      ATLAS_GITHUB_CLIENT_ID: ${ATLAS_GITHUB_CLIENT_ID:-}
      ATLAS_GITHUB_CLIENT_SECRET: ${ATLAS_GITHUB_CLIENT_SECRET:-}
      ATLAS_GITHUB_ALLOWED_USER: ${ATLAS_GITHUB_ALLOWED_USER:-}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8787:8787"
